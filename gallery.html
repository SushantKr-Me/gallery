        ambient: { c: '#3c3a55', i: 2.4 },
        vestibule: { c: '#efe6ff', i: 34 },
        aisle: { c: '#e2d6f7', i: 20 },
        spot: { c: '#f6effe', i: 120 },
        mono: '#f8f8f2', mote: { c: '#e4d9fb', add: true, op: 0.45 },
        accent: '#bd93f9', accentBright: '#dcbcff', exposure: 1.14,
        cat: { fur: '#e3d1f8', fluff: '#f4ecfe', inner: '#c8a8ec', star: '#d9bcff' },
      },
      {
        name: 'Ember', light: false,
        page: '#171008', fog: '#150e07', fogDensity: 0.024,
        wallTarget: '#1e150c', floorTarget: '#191009',
        ceil: '#120c06', skirt: '#140d07', door: '#1c130b',
        frame: '#231809', trim: '#e8985a', trimEmissive: '#4a2c14',
        matBoard: '#f0e6d8', strip: '#f3d9bd',
        ambient: { c: '#4a382a', i: 2.3 },
        vestibule: { c: '#ffdfc0', i: 36 },
        aisle: { c: '#f4cf9f', i: 20 },
        spot: { c: '#ffe9cf', i: 122 },
        mono: '#ffe9d2', mote: { c: '#f4d9bd', add: true, op: 0.45 },
        accent: '#e8985a', accentBright: '#f4b183', exposure: 1.15,
        cat: { fur: '#ffd9bd', fluff: '#fff0e4', inner: '#ffb489', star: '#ffc99c' },
      },
      {
        name: 'Gallery White', light: true,
        page: '#f5f4f2', fog: '#f1efec', fogDensity: 0.02,
        wallTarget: '#fbfaf8', floorTarget: '#e9e6e1',
        ceil: '#ffffff', skirt: '#dedbd6', door: '#f2efe9',
        frame: '#ffffff', trim: '#a8a8a8', trimEmissive: '#141414',
        matBoard: '#faf8f4', strip: '#c9c6c0',
        ambient: { c: '#c8c8cf', i: 2.6 },
        vestibule: { c: '#ffffff', i: 30 },
        aisle: { c: '#ffffff', i: 18 },
        spot: { c: '#ffffff', i: 110 },
        mono: '#24211f', mote: { c: '#8f8f96', add: false, op: 0.3 },
        accent: '#9b9b9b', accentBright: '#c9c9c9', exposure: 0.98,
        /* pure white kitten: white fur + white chest, faint pink ears,
           soft warm-grey sparkles — the dark cartoon outline keeps her legible */
        cat: { fur: '#ffffff', fluff: '#f3f0ec', inner: '#ffe0ea', star: '#d8d3cd' },
      },
    ];
    let themeIndex = 0;

    function hexToRgb(hex) {
      const h = hex.replace('#', '');
      return [
        parseInt(h.slice(0, 2), 16),
        parseInt(h.slice(2, 4), 16),
        parseInt(h.slice(4, 6), 16),
      ];
    }
    /* the wall/floor textures are drawn near-white (#f0f0f0);
       materials get tinted down to reach every dark palette,
       or kept bright for Gallery White */
    function tintFor(targetHex, base = 0.941) {
      const [r, g, b] = hexToRgb(targetHex);
      const f = (v) => Math.min(255, Math.round((v / 255) / base * 255));
      return (f(r) << 16) | (f(g) << 8) | f(b);
    }

    /* room dimensions scaled dynamically to WORKS.length (20 works -> zFar = -210) */
    const SPACING = 10;
    const ROOM = {
      w: 12,
      h: 6.2,
      zNear: 5,
      zFar: -10 - WORKS.length * SPACING,
    };
    const EYE = 2.45;

    /* painting placement: alternate left / right wall */
    const PW = 2.7, PH = 1.8;
    const slots = WORKS.map((_, i) => {
      const side = i % 2 === 0 ? -1 : 1;
      return { side, z: -10 - i * SPACING, x: side * (ROOM.w / 2 - 0.16), y: 2.62 };
    });

    /* sync total count labels in DOM */
    const totalFormatted = String(WORKS.length).padStart(2, '0');
    const railTotalEl = document.getElementById('rail-total');
    const colLabelEl = document.getElementById('col-label');
    if (railTotalEl) railTotalEl.textContent = totalFormatted;
    if (colLabelEl) colLabelEl.textContent = `THE COLLECTION — ${totalFormatted} WORKS`;

    /* ────────────────────────────────────────────────
       RENDERER / SCENE / CAMERA
       ──────────────────────────────────────────────── */
    const canvas = document.getElementById('scene');
    const renderer = new THREE.WebGLRenderer({
      canvas,
      antialias: true,
      powerPreference: 'high-performance',
      stencil: false,
    });

    /* adaptive DPR — starts at the device maximum, is nudged down only if
       frames actually run slow. Resolution changes; the animation never does. */
    const DPR_MAX = Math.min(window.devicePixelRatio || 1, 2);
    let dprCurrent = DPR_MAX;
    renderer.setPixelRatio(dprCurrent);
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.18;

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(COL.bg);
    scene.fog = new THREE.FogExp2(COL.fog, 0.024);

    const roomLen = ROOM.zNear - ROOM.zFar;
    const roomMidZ = (ROOM.zNear + ROOM.zFar) / 2;

    const camera = new THREE.PerspectiveCamera(
      55,
      window.innerWidth / window.innerHeight,
      0.1,
      roomLen + 45
    );

    /* target camera state driven by the GSAP timeline */
    const cam = {
      px: 0, py: EYE, pz: 3.4,
      tx: 0, ty: 2.5, tz: -4,
      fov: 55,
    };

    /* smoothed camera state for ultra-fluid frame-rate-independent damping */
    const smoothCam = {
      px: cam.px, py: cam.py, pz: cam.pz,
      tx: cam.tx, ty: cam.ty, tz: cam.tz,
      fov: cam.fov,
    };
    let lastFov = -1;

    const portraitBoost = () => (camera.aspect < 0.85 ? 1.42 : 1);

    /* pointer parallax */
    const pointer = { x: 0, y: 0, sx: 0, sy: 0 };
    window.addEventListener('pointermove', (e) => {
      pointer.x = (e.clientX / window.innerWidth) * 2 - 1;
      pointer.y = (e.clientY / window.innerHeight) * 2 - 1;
    }, { passive: true });

    /* ────────────────────────────────────────────────
       PROCEDURAL TEXTURES (neutral high-key · tinted per theme)
       ──────────────────────────────────────────────── */
    function canvasTexture(size, draw, repeat = true) {
      const c = document.createElement('canvas');
      c.width = c.height = size;
      draw(c.getContext('2d'), size);
      const t = new THREE.CanvasTexture(c);
      if (repeat) {
        t.wrapS = t.wrapT = THREE.RepeatWrapping;
      }
      t.colorSpace = THREE.SRGBColorSpace;
      t.anisotropy = Math.min(renderer.capabilities.getMaxAnisotropy(), 8);
      return t;
    }

    /* Matte architectural wall with subtle vertical micro-grain.
       Drawn near-white so material.color can tint it to ANY palette. */
    const wallTex = canvasTexture(512, (g, s) => {
      g.fillStyle = '#f0f0f0';
      g.fillRect(0, 0, s, s);
      for (let i = 0; i < 2400; i++) {
        const x = Math.random() * s, y = Math.random() * s;
        const h = 14 + Math.random() * 64, w = 0.6 + Math.random() * 1.6;
        const v = 206 + Math.random() * 26;
        g.fillStyle = `rgba(${v | 0},${v | 0},${(v + 2) | 0},${0.05 + Math.random() * 0.09})`;
        g.fillRect(x, y, w, h);
      }
      for (let x = 0; x < s; x += 64) {
        g.fillStyle = 'rgba(0,0,0,0.42)';
        g.fillRect(x, 0, 1.5, s);
        g.fillStyle = 'rgba(255,255,255,0.16)';
        g.fillRect(x + 1.5, 0, 1, s);
      }
    });
    wallTex.repeat.set(Math.max(3, Math.round(roomLen * 0.04)), 1.4);

    /* Brushed slate plank floor (also neutral, tinted per theme) */
    const floorTex = canvasTexture(512, (g, s) => {
      g.fillStyle = '#efefef';
      g.fillRect(0, 0, s, s);
      const rows = 6, rh = s / rows;
      for (let r = 0; r < rows; r++) {
        const shade = 232 + Math.random() * 12;
        g.fillStyle = `rgb(${shade | 0},${shade | 0},${(shade + 2) | 0})`;
        g.fillRect(0, r * rh, s, rh - 2);
        for (let i = 0; i < 85; i++) {
          const y = r * rh + Math.random() * (rh - 3);
          const v = 198 + Math.random() * 34;
          g.strokeStyle = `rgba(${v | 0},${v | 0},${(v + 2) | 0},0.3)`;
          g.lineWidth = 0.5 + Math.random();
          g.beginPath();
          g.moveTo(Math.random() * s * 0.4, y);
          g.bezierCurveTo(
            s * 0.3, y + (Math.random() - 0.5) * 4,
            s * 0.7, y + (Math.random() - 0.5) * 4,
            s, y
          );
          g.stroke();
        }
        g.fillStyle = 'rgba(0,0,0,0.5)';
        g.fillRect(0, r * rh + rh - 2, s, 2);
        const joint = Math.random() * s;
        g.fillRect(joint, r * rh, 2, rh - 2);
      }
    });
    floorTex.repeat.set(3, Math.max(18, Math.round(roomLen * 0.24)));

    /* Soft radial wall glow texture behind each frame */
    const haloTex = canvasTexture(256, (g, s) => {
      const half = s / 2;
      const grad = g.createRadialGradient(half, half, 4, half, half, half);
      grad.addColorStop(0, 'rgba(255, 255, 255, 0.22)');
      grad.addColorStop(0.45, 'rgba(180, 180, 185, 0.08)');
      grad.addColorStop(1, 'rgba(0, 0, 0, 0)');
      g.fillStyle = grad;
      g.fillRect(0, 0, s, s);
    }, false);

    /* Bespoke fine-art nature composition generator for each of the 20 works
       (renders immediately in standalone preview and serves as fallback if local image is absent) */
    const PALETTES = [
      ['#1a1712', '#3a2f1d', '#d6b87c'], // 01 Valley of Gold
      ['#0b1916', '#16352d', '#7ec4b0'], // 02 Emerald Falls
      ['#1c1410', '#3d281c', '#cfa07a'], // 03 Dunes at Dusk
      ['#0d151c', '#1c3040', '#a9c6d9'], // 04 Wild Coast
      ['#11151c', '#243042', '#d0ddf0'], // 05 Mirror Peaks
      ['#1b140e', '#3b2818', '#deb078'], // 06 Autumn Whispers
      ['#090c10', '#161e29', '#9ab0c7'], // 07 Obsidian Fjord
      ['#0e161f', '#1f3447', '#cce6fa'], // 08 Silent Glacier
      ['#08120e', '#132920', '#7ca892'], // 09 Velvet Canopy
      ['#121214', '#26272b', '#b8bbc2'], // 10 Basalt Columns
      ['#141619', '#2b3038', '#d8dde6'], // 11 Highland Mist
      ['#070910', '#13192b', '#b8c7eb'], // 12 Nocturne Lake
      ['#1a120f', '#36231c', '#c99b84'], // 13 Canyon Echoes
      ['#14181c', '#2c3540', '#e1eaf2'], // 14 Tundra Horizon
      ['#101214', '#24292e', '#e8edf2'], // 15 First Frost
      ['#1a0f0a', '#3a1f14', '#e0a080'], // 16 Crimson Ridge
      ['#0d1410', '#1e2e24', '#a8c4b0'], // 17 Whispering Pines
      ['#050d18', '#0e1f35', '#7fb8e0'], // 18 Moonlit Tide
      ['#06100e', '#0f2820', '#7ce0b0'], // 19 Aurora Veil
      ['#1c1208', '#3a2510', '#f4c880'], // 20 Golden Hour
    ];

    function createArtTexture(index, title) {
      const c = document.createElement('canvas');
      c.width = 960;
      c.height = 640;
      const g = c.getContext('2d');
      const [topCol, midCol, hiCol] = PALETTES[index % PALETTES.length];

      /* Sky gradient */
      const sky = g.createLinearGradient(0, 0, 0, 640);
      sky.addColorStop(0, topCol);
      sky.addColorStop(0.58, midCol);
      sky.addColorStop(1, '#040405');
      g.fillStyle = sky;
      g.fillRect(0, 0, 960, 640);

      /* Celestial sun/moon glow */
      const orbX = 200 + ((index * 173) % 560);
      const orbY = 125 + ((index * 67) % 130);
      const orbR = 46 + (index % 4) * 16;
      const glow = g.createRadialGradient(orbX, orbY, 2, orbX, orbY, orbR * 3.8);
      glow.addColorStop(0, hiCol);
      glow.addColorStop(0.28, 'rgba(255,255,255,0.28)');
      glow.addColorStop(1, 'rgba(0,0,0,0)');
      g.fillStyle = glow;
      g.beginPath();
      g.arc(orbX, orbY, orbR * 3.8, 0, Math.PI * 2);
      g.fill();

      /* Starfield for nocturnal scenes */
      if (index % 3 === 2) {
        g.fillStyle = 'rgba(255,255,255,0.65)';
        for (let s = 0; s < 75; s++) {
          const sx = (s * 97 + index * 31) % 960;
          const sy = (s * 53 + index * 19) % 290;
          const sr = (s % 3 === 0) ? 1.4 : 0.8;
          g.fillRect(sx, sy, sr, sr);
        }
      }

      /* Layered ridges / dunes / waves */
      for (let layer = 0; layer < 5; layer++) {
        const baseY = 265 + layer * 68;
        const alpha = 0.88 + layer * 0.03;
        const shade = Math.max(3, 36 - layer * 7);
        g.fillStyle = `rgba(${shade},${shade},${shade + 2},${alpha})`;
        g.beginPath();
        g.moveTo(0, 640);
        for (let x = 0; x <= 960; x += 20) {
          const ridge =
            Math.sin(x * 0.0065 + index * 1.4 + layer * 1.9) * (48 - layer * 5) +
            Math.cos(x * 0.018 - index * 0.8 + layer * 1.1) * 22 +
            Math.sin(x * 0.042 + layer) * 6;
          g.lineTo(x, baseY + ridge);
        }
        g.lineTo(960, 640);
        g.closePath();
        g.fill();

        /* Rim highlight along the ridge crest */
        if (layer < 3) {
          g.strokeStyle = 'rgba(255,255,255,0.12)';
          g.lineWidth = 1.1;
          g.stroke();
        }
      }

      /* Water reflection / mist shimmer in foreground */
      const mist = g.createLinearGradient(0, 410, 0, 580);
      mist.addColorStop(0, 'rgba(255,255,255,0)');
      mist.addColorStop(0.5, 'rgba(255,255,255,0.09)');
      mist.addColorStop(1, 'rgba(0,0,0,0.45)');
      g.fillStyle = mist;
      g.fillRect(0, 410, 960, 170);

      /* Subtle fine-art plate number */
      g.fillStyle = 'rgba(255,255,255,0.22)';
      g.font = '300 15px "Space Grotesk", sans-serif';
      g.fillText(`${String(index + 1).padStart(2, '0')} · ${title.toUpperCase()}`, 42, 602);

      const t = new THREE.CanvasTexture(c);
      t.colorSpace = THREE.SRGBColorSpace;
      t.anisotropy = Math.min(renderer.capabilities.getMaxAnisotropy(), 8);
      return t;
    }

    /* ────────────────────────────────────────────────
       ROOM SHELL
       ──────────────────────────────────────────────── */
    const room = new THREE.Group();
    scene.add(room);

    const floorMat = new THREE.MeshStandardMaterial({ map: floorTex, color: tintFor(THEMES[0].floorTarget), roughness: 0.42, metalness: 0.28 });
    const floor = new THREE.Mesh(new THREE.PlaneGeometry(ROOM.w, roomLen), floorMat);
    floor.rotation.x = -Math.PI / 2;
    floor.position.set(0, 0, roomMidZ);
    room.add(floor);

    const ceilMat = new THREE.MeshStandardMaterial({ color: 0x020202, roughness: 0.96 });
    const ceil = new THREE.Mesh(new THREE.PlaneGeometry(ROOM.w, roomLen), ceilMat);
    ceil.rotation.x = Math.PI / 2;
    ceil.position.set(0, ROOM.h, roomMidZ);
    room.add(ceil);

    const wallMat = new THREE.MeshStandardMaterial({ map: wallTex, color: tintFor(THEMES[0].wallTarget), roughness: 0.9, metalness: 0.08 });
    const wallGeo = new THREE.PlaneGeometry(roomLen, ROOM.h);

    const wallL = new THREE.Mesh(wallGeo, wallMat);
    wallL.rotation.y = Math.PI / 2;
    wallL.position.set(-ROOM.w / 2, ROOM.h / 2, roomMidZ);
    room.add(wallL);

    const wallR = new THREE.Mesh(wallGeo, wallMat);
    wallR.rotation.y = -Math.PI / 2;
    wallR.position.set(ROOM.w / 2, ROOM.h / 2, roomMidZ);
    room.add(wallR);

    const endWall = new THREE.Mesh(
      new THREE.PlaneGeometry(ROOM.w, ROOM.h),
      new THREE.MeshStandardMaterial({ map: wallTex, color: tintFor(THEMES[0].wallTarget), roughness: 0.9, metalness: 0.08 })
    );
    endWall.position.set(0, ROOM.h / 2, ROOM.zFar);
    room.add(endWall);

    /* obsidian skirting boards */
    const skirtMat = new THREE.MeshStandardMaterial({ color: 0x030303, roughness: 0.5, metalness: 0.2 });
    [-1, 1].forEach((s) => {
      const skirt = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.35, roomLen), skirtMat);
      skirt.position.set(s * (ROOM.w / 2 - 0.05), 0.175, roomMidZ);
      room.add(skirt);
    });

    /* monochrome architectural ceiling light strips receding into depth */
    const stripMat = new THREE.MeshBasicMaterial({ color: COL.strip });
    for (let z = ROOM.zNear - 4; z > ROOM.zFar + 2; z -= 8) {
      const strip = new THREE.Mesh(new THREE.BoxGeometry(2.6, 0.035, 0.12), stripMat);
      strip.position.set(0, ROOM.h - 0.03, z);
      room.add(strip);
    }

    /* vestibule glow so the entrance reads through the SUSHANT letters */
    const vestibule = new THREE.PointLight(0xf2f2f5, 38, 16, 1.7);
    vestibule.position.set(0, 3.6, 2.9);
    scene.add(vestibule);

    const ambient = new THREE.AmbientLight(0x222225, 2.2);
    scene.add(ambient);

    /* Dynamic corridor light pool (prevents WebGL MAX_FRAGMENT_UNIFORM_VECTORS overflow
       while keeping real-time specular/diffuse lighting across all 20 works at 120fps) */
    const aisleLights = [0, 1, 2].map(() => {
      const p = new THREE.PointLight(0xdadadf, 22, 26, 1.75);
      scene.add(p);
      return p;
    });

    const activeSpots = [0, 1, 2, 3].map(() => {
      const spot = new THREE.SpotLight(COL.lightWarm, 125, 13.5, 0.52, 0.82, 1.65);
      const target = new THREE.Object3D();
      scene.add(target);
      spot.target = target;
      scene.add(spot);
      return spot;
    });

    function updateDynamicLights(camZ) {
      const baseZ = Math.round(camZ / 14) * 14;
      aisleLights[0].position.set(0, ROOM.h - 0.7, baseZ + 14);
      aisleLights[1].position.set(0, ROOM.h - 0.7, baseZ);
      aisleLights[2].position.set(0, ROOM.h - 0.7, baseZ - 14);

      const approxIdx = Math.round((-10 - camZ) / SPACING);
      const startIdx = Math.max(0, Math.min(WORKS.length - 4, approxIdx - 1));
      for (let k = 0; k < 4; k++) {
        const s = slots[startIdx + k];
        if (!s) continue;
        const spot = activeSpots[k];
        spot.position.set(s.x - s.side * 1.7, ROOM.h - 0.5, s.z + 0.9);
        spot.target.position.set(s.x, s.y, s.z);
      }
    }
    updateDynamicLights(cam.pz);

    /* ────────────────────────────────────────────────
       PAINTINGS — 20 works, framed in Vantablack & silver
       ──────────────────────────────────────────────── */
    const frameMat = new THREE.MeshStandardMaterial({
      color: COL.frame,
      roughness: 0.38,
      metalness: 0.45,
    });
    const trimMat = new THREE.MeshStandardMaterial({
      color: COL.trim,
      roughness: 0.25,
      metalness: 0.88,
      emissive: 0x242424,
      emissiveIntensity: 0.3,
    });
    const matBoardMat = new THREE.MeshStandardMaterial({
      color: 0xe6e6e6,
      roughness: 0.88,
    });
    const haloMat = new THREE.MeshBasicMaterial({
      map: haloTex,
      transparent: true,
      depthWrite: false,
      blending: THREE.AdditiveBlending,
    });

    const frameGeo = new THREE.BoxGeometry(PW + 0.78, PH + 0.78, 0.09);
    const trimGeo = new THREE.BoxGeometry(PW + 0.56, PH + 0.56, 0.1);
    const matGeo = new THREE.PlaneGeometry(PW + 0.5, PH + 0.5);
    const artGeo = new THREE.PlaneGeometry(PW, PH);
    const haloGeo = new THREE.PlaneGeometry(PW + 3.4, PH + 3.0);

    const texLoader = new THREE.TextureLoader();
    const canLoadRelativeFiles =
      window.location.protocol === 'http:' || window.location.protocol === 'https:';
    /* every procedural painting texture, kept so we can pre-upload them all
       to the GPU behind the preloader (zero hitch when a frame first appears) */
    const artTextures = [];

    WORKS.forEach((work, i) => {
      const s = slots[i];
      const group = new THREE.Group();
      group.position.set(s.x, s.y, s.z);
      group.rotation.y = s.side < 0 ? Math.PI / 2 : -Math.PI / 2;

      /* Start immediately with bespoke high-res canvas artwork so preview is instant & error-free */
      const initialTex = createArtTexture(i, work.title);
      artTextures.push(initialTex);
      const artMat = new THREE.MeshStandardMaterial({
        map: initialTex,
        roughness: 0.82,
        metalness: 0.02,
        emissive: 0xffffff,
        emissiveMap: initialTex,
        emissiveIntensity: 0.48,
      });

      /* If hosted alongside an images/ folder, seamlessly upgrade to external image file */
      if (canLoadRelativeFiles && !window.location.href.startsWith('blob:')) {
        texLoader.load(
          work.src,
          (loadedTex) => {
            loadedTex.colorSpace = THREE.SRGBColorSpace;
            loadedTex.anisotropy = Math.min(renderer.capabilities.getMaxAnisotropy(), 8);
            artMat.map = loadedTex;
            artMat.emissiveMap = loadedTex;
            artMat.needsUpdate = true;
            try { renderer.initTexture(loadedTex); } catch (e) {}
            initialTex.dispose();
          },
          undefined,
          () => { /* Keep procedural artwork silently if external file isn't present */ }
        );
      }

      /* soft wall halo behind frame */
      const halo = new THREE.Mesh(haloGeo, haloMat);
      halo.position.z = -0.04;
      group.add(halo);

      /* outer Vantablack frame */
      const frame = new THREE.Mesh(frameGeo, frameMat);
      group.add(frame);

      /* brushed silver inner trim */
      const trim = new THREE.Mesh(trimGeo, trimMat);
      trim.position.z = 0.005;
      group.add(trim);

      /* archival gallery mat board */
      const mat = new THREE.Mesh(matGeo, matBoardMat);
      mat.position.z = 0.062;
      group.add(mat);

      /* the photograph itself */
      const art = new THREE.Mesh(artGeo, artMat);
      art.position.z = 0.068;
      group.add(art);

      scene.add(group);
    });

    /* ────────────────────────────────────────────────
       END-WALL MONOGRAM — glowing “S.” (white map, tinted per theme)
       ──────────────────────────────────────────────── */
    function drawMonogram() {
      const c = document.createElement('canvas');
      c.width = c.height = 512;
      const g = c.getContext('2d');
      g.clearRect(0, 0, 512, 512);
      g.fillStyle = '#ffffff';
      g.font = '600 290px "Cormorant Garamond", Georgia, serif';
      g.textAlign = 'center';
      g.textBaseline = 'middle';
      g.fillText('S.', 256, 266);
      const t = new THREE.CanvasTexture(c);
      t.colorSpace = THREE.SRGBColorSpace;
      return t;
    }
    const monoMat = new THREE.MeshBasicMaterial({ map: drawMonogram(), transparent: true });
    const mono = new THREE.Mesh(new THREE.PlaneGeometry(2.3, 2.3), monoMat);
    mono.position.set(0, 2.75, ROOM.zFar + 0.18);
    scene.add(mono);

    const monoFrame = new THREE.Mesh(new THREE.BoxGeometry(2.8, 2.8, 0.09), frameMat);
    monoFrame.position.set(0, 2.75, ROOM.zFar + 0.1);
    scene.add(monoFrame);

    const monoHalo = new THREE.Mesh(new THREE.PlaneGeometry(5.2, 5.2), haloMat);
    monoHalo.position.set(0, 2.75, ROOM.zFar + 0.04);
    scene.add(monoHalo);

    const monoSpot = new THREE.SpotLight(COL.lightWarm, 115, 14, 0.55, 0.85, 1.7);
    monoSpot.position.set(0, ROOM.h - 0.5, ROOM.zFar + 3.5);
    monoSpot.target = mono;
    scene.add(monoSpot);

    /* ────────────────────────────────────────────────
       ENTRANCE DOORS
       ──────────────────────────────────────────────── */
    const doorMat = new THREE.MeshStandardMaterial({ color: 0x050505, roughness: 0.42, metalness: 0.38 });
    const doorGeo = new THREE.BoxGeometry(1.55, 4.4, 0.14);
    const doorL = new THREE.Mesh(doorGeo, doorMat);
    const doorR = new THREE.Mesh(doorGeo, doorMat);
    doorL.position.set(-0.78, 2.2, 0.6);
    doorR.position.set(0.78, 2.2, 0.6);
    scene.add(doorL, doorR);

    const handleMat = new THREE.MeshBasicMaterial({ color: COL.trim });
    const handles = [-1, 1].map((s) => {
      const h = new THREE.Mesh(new THREE.SphereGeometry(0.05, 12, 12), handleMat);
      h.position.set(s * 0.18, 2.2, 0.72);
      scene.add(h);
      return h;
    });

    /* lintel glow above the doors */
    const doorGlowMat = new THREE.MeshBasicMaterial({ color: COL.strip });
    const doorGlow = new THREE.Mesh(new THREE.PlaneGeometry(3.6, 0.12), doorGlowMat);
    doorGlow.position.set(0, 4.55, 0.68);
    scene.add(doorGlow);

    /* ────────────────────────────────────────────────
       DUST MOTES
       ──────────────────────────────────────────────── */
    const MOTES = 560;
    const motePos = new Float32Array(MOTES * 3);
    for (let i = 0; i < MOTES; i++) {
      motePos[i * 3] = (Math.random() - 0.5) * (ROOM.w - 1.5);
      motePos[i * 3 + 1] = 0.3 + Math.random() * (ROOM.h - 0.8);
      motePos[i * 3 + 2] = ROOM.zNear - Math.random() * roomLen;
    }
    const moteGeo = new THREE.BufferGeometry();
    moteGeo.setAttribute('position', new THREE.BufferAttribute(motePos, 3));
    const moteMat = new THREE.PointsMaterial({
      color: 0xd8d8dc,
      size: 0.02,
      transparent: true,
      opacity: 0.45,
      depthWrite: false,
      blending: THREE.AdditiveBlending,
    });
    const motes = new THREE.Points(moteGeo, moteMat);
    scene.add(motes);

    /* ────────────────────────────────────────────────
       HERO MASK — the word SUSHANT as a doorway
       ──────────────────────────────────────────────── */
    const maskEl = document.getElementById('hero-mask');
    const maskRect = document.getElementById('mask-rect');
    const lettersG = document.getElementById('mask-letters');
    const WORD = 'SUSHANT';
    const HOLE_CHAR = 4;                    // the “A” — we fly through its counter
    let letterEls = [];

    const measSvg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    measSvg.setAttribute('style', 'position:absolute;left:-9999px;top:0;width:200px;height:200px;visibility:hidden;pointer-events:none');
    document.body.appendChild(measSvg);
    const measText = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    measText.setAttribute('font-family', '"Cormorant Garamond", Georgia, serif');
    measText.setAttribute('font-weight', '700');
    measSvg.appendChild(measText);

    function svgCharBox(ch, size) {
      measText.setAttribute('font-size', size);
      measText.textContent = ch;
      return measText.getBBox();
    }

    function buildMaskLetters() {
      const vw = window.innerWidth, vh = window.innerHeight;
      document.getElementById('mask-svg').setAttribute('viewBox', `0 0 ${vw} ${vh}`);
      lettersG.innerHTML = '';

      const boxes = [...WORD].map((ch) => svgCharBox(ch, 100));
      const track100 = 6;
      const w100 = boxes.reduce((a, b) => a + b.width, 0) + track100 * (WORD.length - 1);
      const h100 = Math.max(...boxes.map((b) => b.height));
      const fs = Math.min((vw * 0.86) / w100 * 100, (vh * 0.36) / h100 * 100);

      const scale = fs / 100;
      const widths = boxes.map((b) => b.width * scale);
      const tracking = track100 * scale;
      const total = widths.reduce((a, b) => a + b, 0) + tracking * (WORD.length - 1);
      let x = (vw - total) / 2;
      const baseline = vh * 0.5 + h100 * scale * 0.36;

      letterEls = WORD.split('').map((ch, i) => {
        const t = document.createElementNS('http://www.w3.org/2000/svg', 'text');
        t.setAttribute('x', x);
        t.setAttribute('y', baseline);
        t.setAttribute('font-size', fs);
        t.textContent = ch;
        lettersG.appendChild(t);
        x += widths[i] + tracking;
        return t;
      });

      const aStartX = parseFloat(letterEls[HOLE_CHAR].getAttribute('x'));
      const ab = boxes[HOLE_CHAR];
      const aCenterX = aStartX + widths[HOLE_CHAR] / 2;
      const aCenterY = baseline + (ab.y + ab.height * 0.55) * scale;
      maskEl.style.transformOrigin = `${aCenterX}px ${aCenterY}px`;
    }

    /* ────────────────────────────────────────────────
       SCROLL CHOREOGRAPHY — continuous non-overlapping splines
       ──────────────────────────────────────────────── */
    const hero = { s: 1, o: 1 };
    const catIntro = { v: 0 };               /* the cat + vinyl appear with the top-left SUSHANT */
    const segBounds = [];
    let finaleStart = 1;

    function buildTimeline() {
      segBounds.length = 0;

      const tl = gsap.timeline({
        defaults: { ease: 'sine.inOut' },
        scrollTrigger: {
          trigger: '#scroll-space',
          start: 'top top',
          end: 'bottom bottom',
          scrub: 1.15,
          onUpdate: (self) => onScrollProgress(self.progress),
        },
      });

      /* — ACT I · through the font — */
      tl.to(doorL.position, { x: -2.75, duration: 0.55, ease: 'power2.inOut' }, 0.04);
      tl.to(doorR.position, { x: 2.75, duration: 0.55, ease: 'power2.inOut' }, 0.04);
      tl.to(handles[0].position, { x: -2.15, duration: 0.55, ease: 'power2.inOut' }, 0.04);
      tl.to(handles[1].position, { x: 2.15, duration: 0.55, ease: 'power2.inOut' }, 0.04);

      tl.to(cam, {
        px: 0, py: EYE, pz: -1.8,
        tx: slots[0].x * 0.5, ty: slots[0].y, tz: slots[0].z,
        duration: 1.0, ease: 'power1.inOut',
      }, 0);

      tl.to(hero, { s: 130, duration: 0.82, ease: 'power3.in' }, 0.05);
      tl.to(hero, { o: 0, duration: 0.25, ease: 'power1.out' }, 0.68);
      tl.to('#hint', { opacity: 0, duration: 0.15 }, 0.02);
      tl.to(['#chrome', '#progress-rail'], { opacity: 1, duration: 0.25 }, 0.82);
      tl.to(catIntro, { v: 1, duration: 0.3, ease: 'power2.out' }, 0.82);   /* ← cat + vinyl pop in with the wordmark */

      let t = 1.0;

      /* — ACT II · the 20-work collection (strictly sequential, zero tween overlap) — */
      slots.forEach((s, i) => {
        const next = slots[i + 1];
        segBounds.push({ start: 0, idx: i, time: t });

        /* 1. Glide smoothly from aisle toward the artwork's viewing angle */
        tl.to(cam, {
          px: s.side * 1.1,
          py: EYE,
          pz: s.z + 6.6,
          tx: s.x,
          ty: s.y,
          tz: s.z,
          fov: 53.5,
          duration: 0.65,
          ease: 'sine.inOut',
        }, t);

        /* 2. Settle into gallery viewing stance */
        tl.to(cam, {
          px: s.x - s.side * 3.55,
          py: EYE + 0.04,
          pz: s.z + 2.35,
          tx: s.x,
          ty: s.y,
          tz: s.z,
          fov: 50,
          duration: 0.45,
          ease: 'sine.inOut',
        }, t + 0.65);

        /* 3. Intimate inspection — frame fills vision */
        tl.to(cam, {
          px: s.x - s.side * 1.88,
          py: s.y,
          pz: s.z + 1.12,
          tx: s.x,
          ty: s.y + 0.04,
          tz: s.z,
          fov: 45,
          duration: 0.6,
          ease: 'power1.inOut',
        }, t + 1.10);

        /* 4. Pull back smoothly into the central aisle toward the next work */
        tl.to(cam, {
          px: 0,
          py: EYE,
          pz: s.z - 4.8,
          tx: next ? next.x : 0,
          ty: next ? next.y : 2.75,
          tz: next ? next.z : ROOM.zFar,
          fov: 55,
          duration: 0.8,
          ease: 'sine.inOut',
        }, t + 1.70);

        t += 2.50;
      });

      /* — ACT III · finale — */
      finaleStart = t;
      tl.to(cam, {
        px: 0, py: 2.6, pz: ROOM.zFar + 5.6,
        tx: 0, ty: 2.75, tz: ROOM.zFar,
        fov: 50, duration: 0.95, ease: 'power2.out',
      }, t);
      tl.to('#dim', { opacity: 0.94, duration: 0.55, ease: 'power1.inOut' }, t + 0.35);
      tl.to(['#caption', '#progress-rail'], { opacity: 0, duration: 0.25 }, t + 0.3);
      t += 1.5;

      const total = tl.duration();
      segBounds.forEach((b) => { b.start = b.time / total; });
      segBounds.push({ start: finaleStart / total, idx: -1 });
      finaleStart = finaleStart / total;
      return tl;
    }

    /* ────────────────────────────────────────────────
       UI STATE — captions, rail, finale
       ──────────────────────────────────────────────── */
    const capNum = document.getElementById('cap-num');
    const capTitle = document.getElementById('cap-title');
    const capSub = document.getElementById('cap-sub');
    const caption = document.getElementById('caption');
    const railNum = document.getElementById('rail-num');
    const railFill = document.getElementById('rail-fill');
    const finaleEl = document.getElementById('finale');

    let activeWork = -2;
    let finaleShown = false;
    let captionTl = null;
    let finaleTl = null;

    function setCaption(i) {
      if (i === activeWork) return;
      activeWork = i;

      if (captionTl) {
        captionTl.kill();
        captionTl = null;
      }
      gsap.killTweensOf(caption);

      if (i < 0) {
        railNum.textContent = finaleShown ? totalFormatted : '00';
        gsap.to(caption, { opacity: 0, y: 10, duration: 0.28, ease: 'power2.out', overwrite: true });
        return;
      }

      const work = WORKS[i];
      const formattedIdx = String(i + 1).padStart(2, '0');
      railNum.textContent = formattedIdx;

      captionTl = gsap.timeline()
        .to(caption, { opacity: 0, y: 10, duration: 0.2, ease: 'power2.in' })
        .add(() => {
          capNum.textContent = formattedIdx;
          capTitle.textContent = work.title;
          capSub.textContent = work.sub;
        })
        .to(caption, { opacity: 1, y: 0, duration: 0.45, ease: 'power3.out' });
    }

    function onScrollProgress(p) {
      railFill.style.transform = `scaleY(${p})`;

      let idx = -1;
      for (let k = 0; k < segBounds.length; k++) {
        if (p >= segBounds[k].start) idx = segBounds[k].idx;
      }
      setCaption(idx);

      if (p > 0.02) gsap.set('#hint', { opacity: 0 });

      if (p >= finaleStart && !finaleShown) {
        finaleShown = true;
        playFinale();
      } else if (p < finaleStart - 0.015 && finaleShown) {
        finaleShown = false;
        hideFinale();
      }
    }

    /* finale text — char by char (without FIN label) */
    const nameEl = document.getElementById('fin-name');
    nameEl.innerHTML = [...nameEl.textContent].map((c) =>
      `<span class="ch${c === ' ' ? ' sp' : ''}">${c === ' ' ? '&nbsp;' : c}</span>`
    ).join('');

    function playFinale() {
      if (finaleTl) finaleTl.kill();
      finaleEl.style.visibility = 'visible';
      finaleEl.style.pointerEvents = 'auto';

      finaleTl = gsap.timeline()
        .fromTo('.fin-small',
          { opacity: 0, y: 16 },
          { opacity: 1, y: 0, duration: 0.7, ease: 'power3.out' }, 0.12)
        .fromTo('#fin-name .ch',
          { yPercent: 115, rotate: 6 },
          { yPercent: 0, rotate: 0, duration: 0.9, stagger: 0.05, ease: 'power4.out' }, 0.22)
        .fromTo('#again',
          { opacity: 0, y: 18 },
          { opacity: 1, y: 0, duration: 0.65, ease: 'power3.out' }, 0.75);
    }

    function hideFinale() {
      if (finaleTl) {
        finaleTl.kill();
        finaleTl = null;
      }
      finaleEl.style.pointerEvents = 'none';
      gsap.set(finaleEl, { visibility: 'hidden' });
      gsap.set(['.fin-small', '#again'], { opacity: 0 });
      gsap.set('#fin-name .ch', { yPercent: 115, rotate: 6 });
    }

    /* ────────────────────────────────────────────────
       SMOOTH SCROLL (Lenis synced to GSAP ticker)
       ──────────────────────────────────────────────── */
    const lenis = typeof Lenis !== 'undefined'
      ? new Lenis({
          lerp: 0.075,
          smoothWheel: true,
          wheelMultiplier: 0.9,
          touchMultiplier: 1.5,
        })
      : {
          on: () => {},
          stop: () => {},
          start: () => {},
          raf: () => {},
          scrollTo: (y) => window.scrollTo({ top: y, behavior: 'smooth' }),
        };

    lenis.on('scroll', ScrollTrigger.update);
    lenis.stop();

    document.getElementById('again').addEventListener('click', () => {
      lenis.scrollTo(0, {
        duration: 3.6,
        easing: (t) => 1 - Math.pow(1 - t, 4),
      });
    });

    /* ────────────────────────────────────────────────
       3D KAWAII CAT — the anime kitten
       A chibi cat with cartoon outlines, blush cheeks, glossy
       eyes and a curled tail, sitting beside the wordmark.
       She is fully animated (see CSS comment) and clicking
       her crossfades the whole gallery — and her own fur —
       to the next theme (pure white in Gallery White).
       ──────────────────────────────────────────────── */
    const catRoot = document.getElementById('cat-roamer');
    const catCanvas = document.getElementById('cat-canvas');

    const catRenderer = new THREE.WebGLRenderer({
      canvas: catCanvas,
      antialias: true,
      alpha: true,
      powerPreference: 'low-power',
    });
    catRenderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    catRenderer.outputColorSpace = THREE.SRGBColorSpace;
    catRenderer.setClearColor(0x000000, 0);

    const catScene = new THREE.Scene();
    const catCam = new THREE.PerspectiveCamera(36, 1, 0.05, 30);
    catCam.position.set(0, 0.62, 3.0);
    catCam.lookAt(0, 0.40, 0);

    catScene.add(new THREE.AmbientLight(0xffffff, 1.05));
    const catKey = new THREE.DirectionalLight(0xffffff, 1.7);
    catKey.position.set(1.6, 2.4, 2.8);
    catScene.add(catKey);
    const catRim = new THREE.DirectionalLight(0xffd7e6, 0.85);
    catRim.position.set(-2.2, 1.4, -1.8);
    catScene.add(catRim);
    const catGlowLight = new THREE.PointLight(0xffb8d0, 0.9, 7, 2);
    catGlowLight.position.set(-0.6, 0.2, 2.4);
    catScene.add(catGlowLight);

    /* kawaii palette (fur + bow recolour with the theme) */
    const catMats = {
      fur: new THREE.MeshStandardMaterial({ color: 0xffcfe0, roughness: 0.85, metalness: 0 }),
      fluff: new THREE.MeshStandardMaterial({ color: 0xffeaf1, roughness: 0.92, metalness: 0 }),
      innerEar: new THREE.MeshStandardMaterial({ color: 0xff9db8, roughness: 0.7, metalness: 0 }),
      eye: new THREE.MeshStandardMaterial({ color: 0x201519, roughness: 0.2, metalness: 0.1 }),
      spark: new THREE.MeshBasicMaterial({ color: 0xffffff }),
      blush: new THREE.MeshBasicMaterial({ color: 0xff9fb6, transparent: true, opacity: 0.8 }),
      dark: new THREE.MeshBasicMaterial({ color: 0x5a3038 }),
      whisker: new THREE.MeshBasicMaterial({ color: 0xfff6f9, transparent: true, opacity: 0.9 }),
      bow: new THREE.MeshStandardMaterial({ color: 0x8d8d8d, roughness: 0.32, metalness: 0.6, emissive: 0x141414, emissiveIntensity: 0.6 }),
      outline: new THREE.MeshBasicMaterial({ color: 0x46241d, side: THREE.BackSide }),
      star: new THREE.MeshBasicMaterial({ color: 0xffaac8, transparent: true, opacity: 0.9, side: THREE.DoubleSide }),
    };

    /* transform layers so manual + gsap animations never fight:
       pop(intro) → sway(idle) → spin(theme) → hop(click) → parts */
    const catPop = new THREE.Group();
    const catSway = new THREE.Group();
    const catSpin = new THREE.Group();
    const catHop = new THREE.Group();
    catScene.add(catPop);
    catPop.add(catSway);
    catSway.add(catSpin);
    catSpin.add(catHop);

    /* inverted-hull cartoon outline (the dark brown line of the illustration) */
    function outlined(mesh, k = 1.05) {
      const o = new THREE.Mesh(mesh.geometry, catMats.outline);
      o.scale.setScalar(k);
      mesh.add(o);
      return mesh;
    }

    /* — body (sitting) — */
    const bodyG = new THREE.Group();
    catHop.add(bodyG);
    const torso = outlined(new THREE.Mesh(new THREE.SphereGeometry(0.34, 26, 20), catMats.fur), 1.045);
    torso.position.y = 0.30;
    torso.scale.set(1, 0.94, 0.96);
    bodyG.add(torso);
    [-1, 1].forEach((s) => {
      const haunch = outlined(new THREE.Mesh(new THREE.SphereGeometry(0.165, 18, 14), catMats.fur), 1.05);
      haunch.position.set(s * 0.20, 0.19, -0.06);
      haunch.scale.set(1, 0.92, 1);
      bodyG.add(haunch);
    });
    const chest = outlined(new THREE.Mesh(new THREE.SphereGeometry(0.19, 18, 14), catMats.fluff), 1.05);
    chest.position.set(0, 0.30, 0.17);
    chest.scale.set(0.98, 1, 0.82);
    bodyG.add(chest);

    /* — front legs + paws (paw pivots lift for wave / groom) — */
    const pawPivots = {};
    [[-1, 'L'], [1, 'R']].forEach(([s, key]) => {
      const pivot = new THREE.Group();
      pivot.position.set(s * 0.13, 0.32, 0.14);
      const leg = outlined(new THREE.Mesh(new THREE.CylinderGeometry(0.062, 0.074, 0.30, 12), catMats.fur), 1.09);
      leg.position.y = -0.13;
      const paw = outlined(new THREE.Mesh(new THREE.SphereGeometry(0.088, 16, 12), catMats.fluff), 1.06);
      paw.position.y = -0.27;
      paw.scale.set(1.12, 0.8, 1.06);
      pivot.add(leg, paw);
      bodyG.add(pivot);
      pawPivots[key] = pivot;
    });

    /* — curled-up tail — */
    const tail = new THREE.Group();
    tail.position.set(0.17, 0.24, -0.27);
    const tailCurve = new THREE.CatmullRomCurve3([
      new THREE.Vector3(0, 0, 0),
      new THREE.Vector3(0.07, 0.06, -0.10),
      new THREE.Vector3(0.11, 0.28, -0.05),
      new THREE.Vector3(0.05, 0.46, 0.03),
      new THREE.Vector3(-0.05, 0.52, 0.06),
    ]);
    const tailOutline = new THREE.Mesh(new THREE.TubeGeometry(tailCurve, 36, 0.072, 10), catMats.outline);
    const tailTube = new THREE.Mesh(new THREE.TubeGeometry(tailCurve, 36, 0.055, 10), catMats.fur);
    const tailTip = outlined(new THREE.Mesh(new THREE.SphereGeometry(0.06, 14, 10), catMats.fluff), 1.1);
    tailTip.position.copy(tailCurve.getPoint(1));
    tail.add(tailOutline, tailTube, tailTip);
    bodyG.add(tail);

    /* — big kawaii head — */
    const headG = new THREE.Group();
    headG.position.set(0, 0.68, 0.03);
    catHop.add(headG);
    const head = outlined(new THREE.Mesh(new THREE.SphereGeometry(0.40, 30, 24), catMats.fur), 1.045);
    head.scale.set(1.07, 0.99, 1.0);
    headG.add(head);

    /* — ears (with pink inner triangles) — */
    const ears = {};
    [[-1, 'L'], [1, 'R']].forEach(([s, key]) => {
      const ear = new THREE.Group();
      ear.position.set(s * 0.235, 0.34, 0.02);
      ear.rotation.set(-0.1, 0, -s * 0.30);
      const outer = outlined(new THREE.Mesh(new THREE.ConeGeometry(0.15, 0.30, 4), catMats.fur), 1.1);
      outer.rotation.y = Math.PI / 4;
      outer.position.y = 0.10;
      const inner = new THREE.Mesh(new THREE.ConeGeometry(0.082, 0.18, 4), catMats.innerEar);
      inner.rotation.y = Math.PI / 4;
      inner.position.set(0, 0.075, 0.05);
      ear.add(outer, inner);
      headG.add(ear);
      ears[key] = ear;
    });

    /* — huge glossy eyes + hidden happy ∩∩ arcs — */
    const eyeGroups = {};
    [[-1, 'L'], [1, 'R']].forEach(([s, key]) => {
      const eg = new THREE.Group();
      eg.position.set(s * 0.155, 0.03, 0.335);
      const ball = new THREE.Mesh(new THREE.SphereGeometry(0.096, 20, 16), catMats.eye);
      ball.scale.set(0.85, 1.1, 0.55);
      const hi1 = new THREE.Mesh(new THREE.SphereGeometry(0.031, 12, 10), catMats.spark);
      hi1.position.set(0.02, 0.038, 0.058);
      const hi2 = new THREE.Mesh(new THREE.SphereGeometry(0.014, 10, 8), catMats.spark);
      hi2.position.set(-0.028, -0.024, 0.058);
      const arc = new THREE.Mesh(new THREE.TorusGeometry(0.055, 0.017, 8, 20, Math.PI), catMats.eye);
      arc.position.set(0, 0.015, 0.045);
      arc.scale.setScalar(0.001);
      eg.add(ball, hi1, hi2, arc);
      headG.add(eg);
      eg.userData = { ball, hi1, hi2, arc, baseX: s * 0.155 };
      eyeGroups[key] = eg;
    });

    /* — blush cheeks, nose, ω mouth, whiskers — */
    [-1, 1].forEach((s) => {
      const blush = new THREE.Mesh(new THREE.SphereGeometry(0.055, 14, 10), catMats.blush);
      blush.position.set(s * 0.27, -0.10, 0.30);
      blush.scale.set(1.55, 0.95, 0.5);
      headG.add(blush);
    });
    const nose = new THREE.Mesh(
      new THREE.ConeGeometry(0.026, 0.03, 3),
      new THREE.MeshStandardMaterial({ color: 0xff8fae, roughness: 0.5 })
    );
    nose.rotation.x = Math.PI / 2;
    nose.position.set(0, -0.045, 0.402);
    headG.add(nose);
    const mouthArcs = [];
    [-0.025, 0.025].forEach((mx) => {
      const m = new THREE.Mesh(new THREE.TorusGeometry(0.02, 0.006, 6, 12, Math.PI), catMats.dark);
      m.position.set(mx, -0.088, 0.395);
      headG.add(m);
      mouthArcs.push(m);
    });
    const mouthOpen = new THREE.Mesh(new THREE.SphereGeometry(0.032, 12, 10), catMats.dark);
    mouthOpen.scale.set(1, 1.4, 0.45);
    mouthOpen.position.set(0, -0.10, 0.385);
    mouthOpen.visible = false;
    headG.add(mouthOpen);
    const whiskers = [];
    [-1, 1].forEach((s) => {
      for (let i = 0; i < 3; i++) {
        const w = new THREE.Mesh(new THREE.CylinderGeometry(0.0035, 0.0035, 0.18, 5), catMats.whisker);
        w.rotation.z = Math.PI / 2 + s * (0.12 + i * 0.17);
        w.position.set(s * 0.37, -0.07 + (i - 1) * 0.030, 0.285);
        w.userData.baseZ = w.rotation.z;
        headG.add(w);
        whiskers.push(w);
      }
    });

    /* — little ribbon bow (recolours with the theme accent) — */
    const bowG = new THREE.Group();
    bowG.position.set(0, 0.33, 0.31);
    catHop.add(bowG);
    const bowLoopGeo = new THREE.SphereGeometry(0.052, 12, 10);
    [-1, 1].forEach((s) => {
      const loop = new THREE.Mesh(bowLoopGeo, catMats.bow);
      loop.scale.set(1.35, 0.85, 0.6);
      loop.position.set(s * 0.06, 0.012, 0);
      bowG.add(loop);
    });
    const bowKnot = new THREE.Mesh(new THREE.SphereGeometry(0.03, 12, 10), catMats.bow);
    bowG.add(bowKnot);

    /* — pink star sparkles (like the illustration's background) — */
    function starGeometry(size) {
      const shape = new THREE.Shape();
      const spikes = 5, outer = size, inner = size * 0.45;
      for (let i = 0; i < spikes * 2; i++) {
        const r = i % 2 === 0 ? outer : inner;
        const a = (i / (spikes * 2)) * Math.PI * 2 - Math.PI / 2;
        const px = Math.cos(a) * r, py = Math.sin(a) * r;
        if (i === 0) shape.moveTo(px, py); else shape.lineTo(px, py);
      }
      shape.closePath();
      return new THREE.ShapeGeometry(shape);
    }
    const starGeoA = starGeometry(0.045);
    const starGeoB = starGeometry(0.065);
    const starG = new THREE.Group();
    catPop.add(starG);
    const ambientStars = [];
    for (let i = 0; i < 9; i++) {
      const st = new THREE.Mesh(i % 3 === 0 ? starGeoB : starGeoA, catMats.star);
      st.userData = {
        r: 0.78 + Math.random() * 0.5,
        a: Math.random() * Math.PI * 2,
        y: -0.05 + Math.random() * 1.1,
        sp: 0.22 + Math.random() * 0.45,
        ph: Math.random() * Math.PI * 2,
        sc: 0.75 + Math.random() * 0.75,
      };
      starG.add(st);
      ambientStars.push(st);
    }

    /* — star burst pool for clicks — */
    const burstGeo = starGeometry(0.05);
    const burstPool = [];
    for (let i = 0; i < 16; i++) {
      const mat = catMats.star.clone();
      const st = new THREE.Mesh(burstGeo, mat);
      st.visible = false;
      catPop.add(st);
      burstPool.push({ mesh: st, mat, vx: 0, vy: 0, vz: 0, rs: 0, life: 0 });
    }
    function burstStars(n = 10) {
      let placed = 0;
      for (const b of burstPool) {
        if (placed >= n) break;
        if (b.life > 0) continue;
        placed++;
        const a = Math.random() * Math.PI * 2;
        const sp = 0.9 + Math.random() * 1.3;
        b.vx = Math.cos(a) * sp;
        b.vy = Math.sin(a) * sp * 0.75 + 1.0;
        b.vz = (Math.random() - 0.5) * 0.5;
        b.rs = (Math.random() - 0.5) * 8;
        b.life = 0.85 + Math.random() * 0.45;
        b.mesh.position.set((Math.random() - 0.5) * 0.25, 0.35 + Math.random() * 0.35, 0.1);
        b.mesh.rotation.z = Math.random() * Math.PI;
        b.mesh.scale.setScalar(0.75 + Math.random() * 0.6);
        b.mesh.visible = true;
        b.mat.opacity = 1;
      }
    }

    /* ────────────────────────────────────────────────
       CAT BEHAVIOURS — the many little animations
       ──────────────────────────────────────────────── */
    let nowS = 0;
    let scrollVel = 0;
    const easeOutBack = (x) => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };

    const catState = {
      happy: false, sleepy: false, busy: false,
      lastInteract: 0, greeted: false,
      blinkAt: 2.5, earAt: 3.5, whiskAt: 5, groomAt: 12, tiltAt: 8,
      wagPhase: 0, wind: 0, droop: 0,
    };
    /* periodic "click me" nudges — counts how often each toy was used */
    const hintState = { catNext: 0, vinylNext: 0, catClicks: 0, vinylClicks: 0 };
    const catLook = { x: 0, y: 0, tx: 0, ty: 0 };
    const catCenter = { x: 0, y: 0 };
    const headOff = { x: 0, z: 0 };       /* gsap-driven head offsets (groom / tilt) */

    function refreshCatCenter() {
      const r = catRoot.getBoundingClientRect();
      catCenter.x = r.left + r.width / 2;
      catCenter.y = r.top + r.height / 2;
    }

    function wake() {
      catState.lastInteract = nowS;
      if (catState.sleepy) {
        catState.sleepy = false;
        gsap.to([eyeGroups.L.scale, eyeGroups.R.scale], { y: 1, duration: 0.3, ease: 'power2.out', overwrite: 'auto' });
        blink(true);
      }
    }

    function blink(double = false) {
      const base = catState.sleepy ? 0.35 : 1;
      const sL = eyeGroups.L.scale, sR = eyeGroups.R.scale;
      const tl = gsap.timeline();
      tl.to([sL, sR], { y: 0.05, duration: 0.07, ease: 'power2.in', overwrite: 'auto' })
        .to([sL, sR], { y: base, duration: 0.11, ease: 'power2.out' });
      if (double) {
        tl.to([sL, sR], { y: 0.05, duration: 0.06, ease: 'power2.in' }, '+=0.1')
          .to([sL, sR], { y: base, duration: 0.1, ease: 'power2.out' });
      }
    }

    function setHappyEyes(on) {
      [eyeGroups.L, eyeGroups.R].forEach((eg) => {
        const { ball, hi1, hi2, arc } = eg.userData;
        const z = on ? 1 : 0.001;
        gsap.to(ball.scale, { x: on ? 0.001 : 0.85, y: on ? 0.001 : 1.1, z: on ? 0.001 : 0.55, duration: 0.18, overwrite: 'auto' });
        gsap.to(hi1.scale, { x: z, y: z, z: z, duration: 0.18, overwrite: 'auto' });
        gsap.to(hi2.scale, { x: z, y: z, z: z, duration: 0.18, overwrite: 'auto' });
        gsap.to(arc.scale, { x: on ? 1 : 0.001, y: on ? 1 : 0.001, z: 1, duration: 0.22, ease: 'back.out(2.5)', overwrite: 'auto' });
      });
    }

    function setHappy(on) {
      if (catState.happy === on) return;
      catState.happy = on;
      wake();
      setHappyEyes(on);
      gsap.to(catMats.blush, { opacity: on ? 1 : 0.8, duration: 0.3, overwrite: 'auto' });
      if (on && Math.random() < 0.55) showBubble('purr purr ♡', 1100);
    }

    function flutterWhiskers(strength = 0.22) {
      whiskers.forEach((w) => {
        const bz = w.userData.baseZ;
        gsap.timeline({ overwrite: 'auto' })
          .to(w.rotation, { z: bz + (Math.random() - 0.5) * strength * 2, duration: 0.07 })
          .to(w.rotation, { z: bz, duration: 0.4, ease: 'power2.out' });
      });
    }

    function twitchEar() {
      const side = Math.random() < 0.5 ? ears.L : ears.R;
      const baseZ = side === ears.L ? 0.30 : -0.30;
      const dir = side === ears.L ? 1 : -1;
      gsap.timeline({ overwrite: 'auto' })
        .to(side.rotation, { z: baseZ + dir * 0.38, duration: 0.08, ease: 'power2.out' })
        .to(side.rotation, { z: baseZ, duration: 0.55, ease: 'elastic.out(1, 0.35)' });
    }

    function groom() {
      const paw = pawPivots.R;
      gsap.timeline({ overwrite: 'auto' })
        .to(headOff, { x: 0.4, z: -0.16, duration: 0.4, ease: 'power2.inOut' })
        .to(paw.rotation, { x: -1.5, z: -0.3, duration: 0.45, ease: 'back.out(1.7)' }, '<')
        .to(paw.rotation, { z: -0.12, duration: 0.16, repeat: 5, yoyo: true, ease: 'none' }, '>0.05')
        .to(paw.rotation, { x: 0, z: 0, duration: 0.4, ease: 'power2.inOut' })
        .to(headOff, { x: 0, z: 0, duration: 0.4, ease: 'power2.inOut' }, '<');
    }

    function curiousTilt() {
      const dir = Math.random() < 0.5 ? -1 : 1;
      gsap.timeline({ overwrite: 'auto' })
        .to(headOff, { z: dir * 0.28, duration: 0.5, ease: 'back.out(1.8)' })
        .to(headOff, { z: 0, duration: 0.6, ease: 'power2.inOut' }, '+=1.2');
    }

    function greet() {
      wake();
      showBubble('nya ~ ♡', 1400);
      burstStars(7);
      blink(true);
      const paw = pawPivots.R;
      gsap.timeline({ overwrite: 'auto' })
        .to(paw.rotation, { x: -1.7, duration: 0.35, ease: 'back.out(1.8)' })
        .to(paw.rotation, { z: -0.45, duration: 0.13, repeat: 5, yoyo: true, ease: 'none' }, '-=0.05')
        .to(paw.rotation, { x: 0, z: 0, duration: 0.35, ease: 'power2.inOut' });
      [ears.L, ears.R].forEach((ear) => {
        const baseZ = ear === ears.L ? 0.30 : -0.30;
        const dir = ear === ears.L ? 1 : -1;
        gsap.timeline({ overwrite: 'auto' })
          .to(ear.rotation, { z: baseZ + dir * 0.25, duration: 0.15 })
          .to(ear.rotation, { z: baseZ, duration: 0.7, ease: 'elastic.out(1, 0.4)' });
      });
    }

    /* — speech bubbles (cat + vinyl share the same machinery) — */
    const bubbleEl = document.getElementById('cat-bubble');
    const vinylBubbleEl = document.getElementById('vinyl-bubble');
    let bubbleTl = null;
    let vinylBubbleTl = null;
    let catBubbleUntil = 0;
    let vinylBubbleUntil = 0;

    function showBubble(text, ms = 1400) {
      bubbleEl.textContent = text;
      const r = catRoot.getBoundingClientRect();
      bubbleEl.style.left = `${Math.min(r.right + 10, window.innerWidth - 150)}px`;
      bubbleEl.style.top = `${Math.max(8, r.top - 6)}px`;
      catBubbleUntil = nowS + ms / 1000 + 0.45;
      if (bubbleTl) bubbleTl.kill();
      bubbleTl = gsap.timeline()
        .fromTo(bubbleEl, { opacity: 0, scale: 0.4, y: 10 }, { opacity: 1, scale: 1, y: 0, duration: 0.35, ease: 'back.out(2.4)' })
        .to(bubbleEl, { opacity: 0, scale: 0.75, y: 4, duration: 0.28, ease: 'power2.in' }, `+=${ms / 1000}`);
    }

    function showVinylBubble(text, ms = 1400) {
      vinylBubbleEl.textContent = text;
      const r = vinylRoot.getBoundingClientRect();
      vinylBubbleEl.style.right = `${window.innerWidth - r.left + 10}px`;
      vinylBubbleEl.style.top = `${Math.max(8, r.top - 4)}px`;
      vinylBubbleUntil = nowS + ms / 1000 + 0.45;
      if (vinylBubbleTl) vinylBubbleTl.kill();
      vinylBubbleTl = gsap.timeline()
        .fromTo(vinylBubbleEl, { opacity: 0, scale: 0.4, y: 10 }, { opacity: 1, scale: 1, y: 0, duration: 0.35, ease: 'back.out(2.4)' })
        .to(vinylBubbleEl, { opacity: 0, scale: 0.75, y: 4, duration: 0.28, ease: 'power2.in' }, `+=${ms / 1000}`);
    }

    /* — click: hop + spin + mew + star burst + next theme — */
    function changeTheme() {
      if (catState.busy || catIntro.v < 0.5) return;
      catState.busy = true;
      hintState.catClicks++;
      wake();
      const next = THEMES[(themeIndex + 1) % THEMES.length];
      showBubble(`✦ ${next.name} ✦`, 1500);
      burstStars(12);
      mouthArcs.forEach((m) => (m.visible = false));
      mouthOpen.visible = true;
      gsap.delayedCall(0.55, () => {
        mouthOpen.visible = false;
        mouthArcs.forEach((m) => (m.visible = true));
      });
      if (!catState.happy) {
        setHappyEyes(true);
        gsap.delayedCall(0.7, () => { if (!catState.happy) setHappyEyes(false); });
      }
      gsap.timeline({
        overwrite: 'auto',
        onComplete: () => { catState.busy = false; },
      })
        .to(catHop.position, { y: 0.26, duration: 0.22, ease: 'power2.out' }, 0)
        .to(catHop.scale, { x: 0.9, y: 1.12, z: 0.9, duration: 0.18, ease: 'power2.out' }, 0)
        .to(catHop.position, { y: 0, duration: 0.3, ease: 'bounce.out' }, 0.24)
        .to(catHop.scale, { x: 1, y: 1, z: 1, duration: 0.45, ease: 'elastic.out(1, 0.4)' }, 0.3)
        .fromTo(catSpin.rotation, { y: 0 }, { y: Math.PI * 2, duration: 0.9, ease: 'power2.inOut' }, 0.08)
        .add(() => applyTheme(themeIndex + 1), 0.42);
    }

    /* ────────────────────────────────────────────────
       THEME ENGINE — smooth 0.9s crossfade of everything
       (texts stay white in all themes, incl. Gallery White;
       the kitten repaints to pure white in Gallery White)
       ──────────────────────────────────────────────── */
    function applyTheme(i) {
      themeIndex = ((i % THEMES.length) + THEMES.length) % THEMES.length;
      const th = THEMES[themeIndex];
      const D = 0.9, EZ = 'power2.inOut';

      const root = document.documentElement;
      root.style.setProperty('--page', th.page);
      root.style.setProperty('--ember', th.accent);
      root.style.setProperty('--accent-bright', th.accentBright);
      document.body.classList.toggle('theme-light', !!th.light);
      const meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.setAttribute('content', th.page);
      catRoot.setAttribute('aria-label', `Change gallery theme. Current theme: ${th.name}. Click for the next palette`);

      const col = (target, hex) => {
        const c = new THREE.Color(hex);
        gsap.to(target, { r: c.r, g: c.g, b: c.b, duration: D, ease: EZ, overwrite: 'auto' });
      };

      col(scene.background, th.page);
      col(scene.fog.color, th.fog);
      gsap.to(scene.fog, { density: th.fogDensity, duration: D, ease: EZ, overwrite: 'auto' });
      gsap.to(renderer, { toneMappingExposure: th.exposure, duration: D, ease: EZ, overwrite: 'auto' });

      col(wallMat.color, tintFor(th.wallTarget));
      col(floorMat.color, tintFor(th.floorTarget));
      col(ceilMat.color, th.ceil);
      col(skirtMat.color, th.skirt);
      col(frameMat.color, th.frame);
      col(trimMat.color, th.trim);
      col(trimMat.emissive, th.trimEmissive);
      col(matBoardMat.color, th.matBoard);
      col(stripMat.color, th.strip);
      col(doorMat.color, th.door);
      col(handleMat.color, th.trim);
      col(doorGlowMat.color, th.strip);
      col(monoMat.color, th.mono);

      col(ambient.color, th.ambient.c);
      gsap.to(ambient, { intensity: th.ambient.i, duration: D, ease: EZ, overwrite: 'auto' });
      col(vestibule.color, th.vestibule.c);
      gsap.to(vestibule, { intensity: th.vestibule.i, duration: D, ease: EZ, overwrite: 'auto' });
      aisleLights.forEach((l) => {
        col(l.color, th.aisle.c);
        gsap.to(l, { intensity: th.aisle.i, duration: D, ease: EZ, overwrite: 'auto' });
      });
      activeSpots.forEach((sp) => {
        col(sp.color, th.spot.c);
        gsap.to(sp, { intensity: th.spot.i, duration: D, ease: EZ, overwrite: 'auto' });
      });
      col(monoSpot.color, th.spot.c);
      gsap.to(monoSpot, { intensity: th.spot.i, duration: D, ease: EZ, overwrite: 'auto' });

      col(moteMat.color, th.mote.c);
      moteMat.blending = th.mote.add ? THREE.AdditiveBlending : THREE.NormalBlending;
      moteMat.needsUpdate = true;
      gsap.to(moteMat, { opacity: th.mote.op, duration: D, overwrite: 'auto' });

      /* the kitten repaints herself in the new palette */
      if (th.cat) {
        col(catMats.fur.color, th.cat.fur);
        col(catMats.fluff.color, th.cat.fluff);
        col(catMats.innerEar.color, th.cat.inner);
        col(catMats.star.color, th.cat.star);
        col(catMats.bow.color, th.accent);
      }

      gsap.to('#mask-rect', { attr: { fill: th.page }, duration: D, ease: EZ, overwrite: 'auto' });
    }

    /* ────────────────────────────────────────────────
       VINYL PLAYER — plays YOUR audio file
       ────────────────────────────────────────────────
       ▸ Drop your track next to b.html as  audio/ambient.mp3
       ▸ If the name differs, change TRACK_SRC below.
       ▸ Playback fades in over 1.8s and out over 0.8s, looping.
       ▸ A missing/unsupported file shows a gentle bubble instead
         of breaking the UI. */
    const vinylRoot = document.getElementById('vinyl-roamer');
    const TRACK_SRC = 'audio/ambient.mp3';
    const TRACK_VOLUME = 0.6;

    const music = (() => {
      const audio = new Audio();
      audio.src = TRACK_SRC;
      audio.loop = true;
      audio.preload = 'auto';
      audio.volume = 0;

      let playing = false;
      let failed = false;
      let fadeTl = null;

      audio.addEventListener('error', () => { failed = true; });

      function fadeTo(v, d) {
        if (fadeTl) fadeTl.kill();
        fadeTl = gsap.to(audio, { volume: v, duration: d, ease: 'power2.inOut', overwrite: 'auto' });
      }

      return {
        toggle() {
          if (failed) return false;
          if (!playing) {
            const p = audio.play();
            if (p && p.catch) {
              p.catch(() => { failed = true; playing = false; });
            }
            fadeTo(TRACK_VOLUME, 1.8);
            playing = true;
          } else {
            fadeTo(0, 0.8);
            gsap.delayedCall(0.85, () => { if (!playing) audio.pause(); });
            playing = false;
          }
          return playing;
        },
        get playing() { return playing; },
        get failed() { return failed; },
      };
    })();

    function toggleMusic() {
      if (music.failed) {
        showVinylBubble('add audio/ambient.mp3', 2200);
        return;
      }
      const on = music.toggle();
      vinylRoot.classList.toggle('playing', on);
      vinylRoot.setAttribute('aria-pressed', String(on));
      vinylRoot.setAttribute('aria-label', on ? 'Pause ambient music' : 'Play ambient music');
      hintState.vinylClicks++;

      if (music.failed) {
        vinylRoot.classList.remove('playing');
        vinylRoot.setAttribute('aria-pressed', 'false');
        showVinylBubble('add audio/ambient.mp3', 2200);
        return;
      }
      showVinylBubble(on ? 'now playing ♪' : 'paused', 1500);

      /* the play() promise can reject a beat later — undo the UI if so */
      gsap.delayedCall(0.6, () => {
        if (music.failed) {
          vinylRoot.classList.remove('playing');
          vinylRoot.setAttribute('aria-pressed', 'false');
          vinylRoot.setAttribute('aria-label', 'Play ambient music');
        }
      });
    }

    vinylRoot.addEventListener('click', toggleMusic);
    vinylRoot.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggleMusic(); }
    });

    /* periodic hints so everyone discovers the two toys */
    function updateHints() {
      if (catIntro.v < 0.9) return;

      if (nowS > hintState.catNext && nowS > catBubbleUntil && !catState.busy) {
        hintState.catNext = nowS + (hintState.catClicks ? 22 + Math.random() * 9 : 9 + Math.random() * 4);
        hintState.vinylNext = Math.max(hintState.vinylNext, nowS + 4);
        showBubble(hintState.catClicks ? 'change theme ✦' : 'click me ✦', 1700);
      }
      if (nowS > hintState.vinylNext && nowS > vinylBubbleUntil) {
        hintState.vinylNext = nowS + (hintState.vinylClicks ? 24 + Math.random() * 9 : 10 + Math.random() * 4);
        hintState.catNext = Math.max(hintState.catNext, nowS + 4);
        showVinylBubble(
          hintState.vinylClicks
            ? (music.playing ? 'music on ♪' : 'music off ♪')
            : 'play music ♪',
          1700
        );
      }
    }

    /* ────────────────────────────────────────────────
       CAT PER-FRAME UPDATE
       ──────────────────────────────────────────────── */
    let lastCatOpacity = -1;
    let catInteractive = null;
    let lastVinylOpacity = -1;
    let vinylInteractive = null;
    let lastHeroS = -1;
    let lastHeroO = -1;

    function updateCat(dt, t) {
      const v = catIntro.v;

      /* intro — appears exactly with the top-left SUSHANT wordmark.
         Style writes are guarded so the compositor isn't touched 60×/s
         while the value is already settled. */
      if (v !== lastCatOpacity) {
        catRoot.style.opacity = v;
        lastCatOpacity = v;
      }
      const wantCatPointer = v > 0.5;
      if (wantCatPointer !== catInteractive) {
        catRoot.style.pointerEvents = wantCatPointer ? 'auto' : 'none';
        catInteractive = wantCatPointer;
      }

      catPop.scale.setScalar(Math.max(0.001, easeOutBack(clampf(v, 0, 1))));
      catPop.position.x = (1 - v) * -0.55;
      catPop.position.y = (1 - v) * 0.12 + Math.sin(t * 1.6) * 0.018;
      if (!catState.greeted && v > 0.6) { catState.greeted = true; greet(); }
      if (v < 0.05 && catState.greeted) catState.greeted = false;
      if (v <= 0.002) return;

      const s = catState;
      s.lastInteract = s.lastInteract || t;

      /* sleepy when you idle */
      if (!s.sleepy && !s.happy && !s.busy && t - s.lastInteract > 14) {
        s.sleepy = true;
        gsap.to([eyeGroups.L.scale, eyeGroups.R.scale], { y: 0.32, duration: 1.6, ease: 'power2.inOut', overwrite: 'auto' });
      }
      if (s.sleepy && (s.happy || s.busy)) wake();

      /* breathing */
      const breathe = Math.sin(t * (s.sleepy ? 1.3 : 2.2));
      bodyG.scale.set(1 + breathe * 0.012, 1 + breathe * (s.sleepy ? 0.02 : 0.032), 1 + breathe * 0.012);
      headG.position.y = 0.68 + Math.sin(t * 2.2 + 0.5) * 0.012;

      /* gentle idle sway */
      catSway.rotation.z = Math.sin(t * 0.7) * 0.022;
      catSway.rotation.y = Math.sin(t * 0.43) * 0.045;

      /* scroll wind — ears fly back, tail streams, when you scroll fast */
      scrollVel *= Math.exp(-dt * 5);
      s.wind = damp(s.wind, clampf(Math.abs(scrollVel) * 0.016, 0, 0.55), 5, dt);
      ears.L.rotation.x = -0.1 - s.wind;
      ears.R.rotation.x = -0.1 - s.wind;

      /* head + pupil tracking — frame-rate-independent damping */
      catLook.x = damp(catLook.x, catLook.tx, 6, dt);
      catLook.y = damp(catLook.y, catLook.ty, 6, dt);
      s.droop = damp(s.droop, s.sleepy ? 1 : 0, 1.5, dt);
      headG.rotation.x = -catLook.y * 0.34 + headOff.x + s.droop * 0.4 + Math.sin(t * 0.9) * 0.02;
      headG.rotation.y = catLook.x * 0.5;
      headG.rotation.z = headOff.z + (s.happy ? Math.sin(t * 6.5) * 0.03 : Math.sin(t * 1.7) * 0.02);
      [eyeGroups.L, eyeGroups.R].forEach((eg) => {
        eg.position.x = eg.userData.baseX + catLook.x * 0.02;
        eg.position.y = 0.03 - catLook.y * 0.02;
      });

      /* tail wag — mood aware */
      const wagSpd = s.happy ? 9.5 : s.sleepy ? 1.1 : 2.6;
      s.wagPhase += dt * wagSpd;
      const wagAmp = s.happy ? 0.5 : 0.22;
      tail.rotation.z = Math.sin(s.wagPhase) * wagAmp * 0.7;
      tail.rotation.x = Math.cos(s.wagPhase * 0.6) * wagAmp * 0.35 + s.wind * 0.9;
      tail.rotation.y = Math.sin(s.wagPhase * 0.8) * wagAmp * 0.3;

      /* bow jiggle */
      bowG.rotation.z = Math.sin(t * 2.2 + 1) * 0.05 + (s.happy ? Math.sin(t * 9) * 0.06 : 0);

      /* scheduled micro-behaviours */
      if (!s.sleepy && !s.busy) {
        if (t > s.blinkAt) { s.blinkAt = t + 2 + Math.random() * 4.5; blink(Math.random() < 0.25); }
        if (t > s.earAt) {
          s.earAt = t + 2.5 + Math.random() * 5;
          twitchEar();
          if (Math.random() < 0.5) flutterWhiskers();
        } else if (t > s.whiskAt) {
          s.whiskAt = t + 4 + Math.random() * 5;
          flutterWhiskers(0.16);
        }
        if (!s.happy && t > s.groomAt) { s.groomAt = t + 11 + Math.random() * 10; groom(); }
        if (!s.happy && t > s.tiltAt) { s.tiltAt = t + 7 + Math.random() * 8; curiousTilt(); }
      }

      /* ambient twinkling stars */
      for (const st of ambientStars) {
        const ud = st.userData;
        ud.a += dt * ud.sp * 0.7;
        st.position.set(Math.cos(ud.a) * ud.r, ud.y + Math.sin(t * 0.8 + ud.ph) * 0.06, Math.sin(ud.a) * ud.r * 0.55 - 0.25);
        st.rotation.z = t * 0.6 + ud.ph;
        const tw = 0.55 + 0.45 * Math.sin(t * 2.3 + ud.ph * 2.7);
        st.scale.setScalar(ud.sc * tw);
      }

      /* star bursts */
      for (const b of burstPool) {
        if (b.life <= 0) continue;
        b.life -= dt;
        b.vy -= 2.7 * dt;
        b.mesh.position.x += b.vx * dt;
        b.mesh.position.y += b.vy * dt;
        b.mesh.position.z += b.vz * dt;
        b.mesh.rotation.z += b.rs * dt;
        b.mat.opacity = clampf(b.life / 0.8, 0, 1);
        if (b.life <= 0) b.mesh.visible = false;
      }
    }

    /* cat interaction wiring */
    catRoot.addEventListener('pointerenter', () => setHappy(true));
    catRoot.addEventListener('pointerleave', () => setHappy(false));
    catRoot.addEventListener('focus', () => setHappy(true));
    catRoot.addEventListener('blur', () => setHappy(false));
    catRoot.addEventListener('click', () => changeTheme());
    catRoot.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); changeTheme(); }
    });
    window.addEventListener('pointermove', (e) => {
      catLook.tx = clampf((e.clientX - catCenter.x) / (window.innerWidth * 0.5), -1.1, 1.1);
      catLook.ty = clampf((e.clientY - catCenter.y) / (window.innerHeight * 0.5), -1.1, 1.1);
      catState.lastInteract = nowS;
    }, { passive: true });

    /* scroll velocity → ear-wind + tail stream */
    lenis.on('scroll', (e) => { scrollVel = e.velocity || 0; });

    /* ────────────────────────────────────────────────
       ADAPTIVE RENDERING + GPU PRE-WARM
       Keeps motion perfectly smooth on weaker GPUs by nudging
       the pixel ratio only — never the animation itself.
       ──────────────────────────────────────────────── */
    const perf = { acc: 0, frames: 0, cooldown: 45 };
    function monitorPerf(dtMs) {
      if (perf.cooldown > 0) { perf.cooldown--; return; }
      perf.acc += dtMs; perf.frames++;
      if (perf.frames < 90) return;
      const avg = perf.acc / perf.frames;
      perf.acc = 0; perf.frames = 0;

      if (avg > 21 && dprCurrent > 1) {              /* slower than ~45fps */
        dprCurrent = Math.max(1, dprCurrent - 0.25);
        renderer.setPixelRatio(dprCurrent);
        renderer.setSize(window.innerWidth, window.innerHeight);
        perf.cooldown = 90;
      } else if (avg < 15 && dprCurrent < DPR_MAX) { /* comfortable headroom */
        dprCurrent = Math.min(DPR_MAX, dprCurrent + 0.25);
        renderer.setPixelRatio(dprCurrent);
        renderer.setSize(window.innerWidth, window.innerHeight);
        perf.cooldown = 90;
      }
    }

    /* Upload every texture and compile every shader once, behind the
       preloader — so the first time a painting enters view there is
       zero hitch. */
    function warmUpGPU() {
      const allTex = [wallTex, floorTex, haloTex, monoMat.map, ...artTextures];
      for (const t of allTex) {
        try { renderer.initTexture(t); } catch (e) { /* ignore */ }
      }
      try { renderer.compile(scene, camera); } catch (e) { /* ignore */ }
      try { catRenderer.compile(catScene, catCam); } catch (e) { /* ignore */ }
    }

    /* ────────────────────────────────────────────────
       MAIN LOOP — one ticker drives Lenis, the gallery, the cat, the vinyl
       ──────────────────────────────────────────────── */
    function sizeCat() {
      const w = catRoot.clientWidth || 56;
      const h = catRoot.clientHeight || 56;
      catCam.aspect = w / h;
      catCam.updateProjectionMatrix();
      catRenderer.setSize(w, h, false);
    }

    gsap.ticker.lagSmoothing(0);
    gsap.ticker.add((time, deltaMS) => {
      nowS = time;
      lenis.raf(time * 1000);
      const dt = Math.min((deltaMS || 16.7) / 1000, 0.05);

      /* adaptive-resolution watchdog (ignores huge deltas after tab switches) */
      monitorPerf(Math.min(deltaMS || 16.7, 50));

      /* smoothed camera toward timeline targets */
      const k = 1 - Math.exp(-dt * 7.4);
      smoothCam.px += (cam.px - smoothCam.px) * k;
      smoothCam.py += (cam.py - smoothCam.py) * k;
      smoothCam.pz += (cam.pz - smoothCam.pz) * k;
      smoothCam.tx += (cam.tx - smoothCam.tx) * k;
      smoothCam.ty += (cam.ty - smoothCam.ty) * k;
      smoothCam.tz += (cam.tz - smoothCam.tz) * k;
      smoothCam.fov += (cam.fov - smoothCam.fov) * k;

      const pk = 1 - Math.exp(-dt * 3.4);
      pointer.sx += (pointer.x - pointer.sx) * pk;
      pointer.sy += (pointer.y - pointer.sy) * pk;

      camera.position.set(
        smoothCam.px + pointer.sx * 0.38,
        smoothCam.py - pointer.sy * 0.22,
        smoothCam.pz
      );
      /* only rebuild the projection matrix when the FOV actually moved */
      const fovNow = smoothCam.fov * portraitBoost();
      if (Math.abs(fovNow - lastFov) > 1e-4) {
        camera.fov = fovNow;
        camera.updateProjectionMatrix();
        lastFov = fovNow;
      }
      camera.lookAt(
        smoothCam.tx + pointer.sx * 0.55,
        smoothCam.ty - pointer.sy * 0.35,
        smoothCam.tz
      );

      updateDynamicLights(camera.position.z);
      motes.rotation.y = time * 0.012;

      /* hero mask — scale through the letter counter (guard style writes) */
      if (hero.s !== lastHeroS || hero.o !== lastHeroO) {
        maskEl.style.transform = `scale(${hero.s})`;
        maskEl.style.opacity = hero.o;
        maskEl.style.visibility = hero.o <= 0.01 ? 'hidden' : 'visible';
        lastHeroS = hero.s;
        lastHeroO = hero.o;
      }

      renderer.render(scene, camera);

      /* vinyl pops in with the same beat as the cat */
      if (catIntro.v !== lastVinylOpacity) {
        vinylRoot.style.opacity = catIntro.v;
        lastVinylOpacity = catIntro.v;
      }
      const wantVinylPointer = catIntro.v > 0.5;
      if (wantVinylPointer !== vinylInteractive) {
        vinylRoot.style.pointerEvents = wantVinylPointer ? 'auto' : 'none';
        vinylInteractive = wantVinylPointer;
      }

      updateCat(dt, time);
      if (catIntro.v > 0.002) catRenderer.render(catScene, catCam);

      updateHints();
    });

    /* ────────────────────────────────────────────────
       RESIZE — cheap on purpose: mobile URL-bar height noise
       must not trigger a full mask rebuild + ScrollTrigger.refresh
       ──────────────────────────────────────────────── */
    let resizeQueued = false;
    let lastW = window.innerWidth;
    let lastH = window.innerHeight;
    window.addEventListener('resize', () => {
      if (resizeQueued) return;
      resizeQueued = true;
      requestAnimationFrame(() => {
        resizeQueued = false;
        const w = window.innerWidth, h = window.innerHeight;
        const widthChanged = Math.abs(w - lastW) > 1;
        const heightChangedALot = Math.abs(h - lastH) > 120;

        camera.aspect = w / h;
        camera.updateProjectionMatrix();
        lastFov = camera.fov;
        renderer.setPixelRatio(dprCurrent);
        renderer.setSize(w, h);

        if (widthChanged || heightChangedALot) {
          buildMaskLetters();
          ScrollTrigger.refresh();
        }
        lastW = w; lastH = h;
        sizeCat();
        refreshCatCenter();
      });
    });

    /* tab visibility — drop accumulated perf samples so the
       adaptive monitor never mis-reads a throttled background tab */
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden) { perf.acc = 0; perf.frames = 0; perf.cooldown = 45; }
    });

    /* ────────────────────────────────────────────────
       CURSOR DOT
       ──────────────────────────────────────────────── */
    const cursorEl = document.getElementById('cursor');
    gsap.set(cursorEl, { xPercent: -50, yPercent: -50, x: -200, y: -200 });
    const curX = gsap.quickTo(cursorEl, 'x', { duration: 0.32, ease: 'power3' });
    const curY = gsap.quickTo(cursorEl, 'y', { duration: 0.32, ease: 'power3' });
    window.addEventListener('pointermove', (e) => {
      curX(e.clientX);
      curY(e.clientY);
      gsap.to(cursorEl, { opacity: 1, duration: 0.3, overwrite: 'auto' });
    }, { passive: true });
    document.documentElement.addEventListener('mouseleave', () => {
      gsap.to(cursorEl, { opacity: 0, duration: 0.4, overwrite: 'auto' });
    });

    /* ────────────────────────────────────────────────
       PRELOADER
       ──────────────────────────────────────────────── */
    function runPreloader() {
      if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
      window.scrollTo(0, 0);
      const countEl = document.querySelector('.pre-count');
      const counter = { n: 0 };
      gsap.set('.pre-inner', { opacity: 0, y: 12 });
      gsap.timeline()
        .to('.pre-inner', { opacity: 1, y: 0, duration: 0.7, ease: 'power3.out' }, 0.15)
        .to(counter, {
          n: WORKS.length, duration: 1.6, ease: 'power2.inOut',
          onUpdate: () => { countEl.textContent = String(Math.round(counter.n)).padStart(2, '0'); },
        }, 0.15)
        .to('.pre-bar-fill', { scaleX: 1, duration: 1.6, ease: 'power2.inOut' }, 0.15)
        .to('.pre-inner', { opacity: 0, y: -14, duration: 0.45, ease: 'power2.in' }, '+=0.3')
        .to('.pre-curtain.left', { xPercent: -101, duration: 1.05, ease: 'power4.inOut' }, '<0.12')
        .to('.pre-curtain.right', { xPercent: 101, duration: 1.05, ease: 'power4.inOut' }, '<')
        .add(() => {
          lenis.start();
          gsap.to('#hint', { opacity: 1, duration: 0.9, delay: 0.35 });
        }, '-=0.55')
        .set('#preloader', { display: 'none' });
    }

    /* ────────────────────────────────────────────────
       BOOT
       ──────────────────────────────────────────────── */
    buildMaskLetters();
    buildTimeline();
    sizeCat();
    refreshCatCenter();
    warmUpGPU();
    if (document.fonts && document.fonts.ready) {
      document.fonts.ready.then(() => buildMaskLetters());
    }
    runPreloader();
  </script>
</body>
</html>
